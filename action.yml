name: Gitea Backporter
description: Run the Gitea backporter maintenance tasks as a GitHub Action
author: GiteaBot
inputs:
  github_token:
    description: GitHub token with access to go-gitea/gitea and your fork
    required: true
  gitea_fork:
    description: Fork of go-gitea/gitea used to push backport branches (owner/repo); required when the backport check is enabled
    required: false
  checks:
    description: Comma-separated list of checks to run. Use all or none, or select from backport, labels, merge_queue, lock, feedback, last_call, milestones, lgtm, translation_comment, pr_actions.
    required: false
    default: all
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 26
    # pnpm/action-setup only accepts a package.json path relative to the workspace
    - name: Locate package.json
      id: package-json
      shell: bash
      run: echo "path=$(node -p 'path.relative(process.env.GITHUB_WORKSPACE, process.env.GITHUB_ACTION_PATH + "/package.json")')" >> "$GITHUB_OUTPUT"
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        package_json_file: ${{ steps.package-json.outputs.path }}
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile --prod --dir "${{ github.action_path }}"
    - name: Run backporter
      shell: bash
      env:
        BACKPORTER_GITHUB_TOKEN: ${{ inputs.github_token }}
        BACKPORTER_GITEA_FORK: ${{ inputs.gitea_fork }}
        BACKPORTER_CHECKS: ${{ inputs.checks }}
      run: |
        node "${{ github.action_path }}/src/action.ts"
